[package]
name = "openid4vp-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[lints.cargo]
# cargo-fuzz treats each binary name as a stable target identifier. Preserve
# the existing corpus and artifact directory names instead of renaming every
# target solely to satisfy Cargo's display-name convention.
non_kebab_case_bins = "allow"

[workspace]

[dependencies]
buffa = { version = "0.9.1", features = ["json"] }
libfuzzer-sys = "0.4.13"
reallyme-codec = { version = "=0.2.3", default-features = false, features = ["base64url"] }
reallyme-crypto = { version = "=0.3.9", default-features = false, features = ["jwk", "native"] }
reallyme-openid4vp-dcql = { path = "../crates/dcql", version = "0.1.0", default-features = false }
reallyme-openid4vp-dc-api = { path = "../crates/dc-api", version = "0.1.0", default-features = false }
reallyme-openid4vp-formats = { path = "../crates/formats", version = "0.1.0", default-features = false, features = ["native"] }
reallyme-openid4vp-proto = { path = "../crates/proto", version = "0.1.0", default-features = false, features = ["generated"] }
reallyme-openid4vp-proto-codec = { path = "../crates/proto-codec", version = "0.1.0", default-features = false }
reallyme-jose = { version = "=0.4.0", default-features = false, features = ["native"] }
reallyme-openid4vp-runtime = { path = "../crates/runtime", version = "0.1.0", default-features = false, features = ["jose"] }
reallyme-openid4vp-types = { path = "../crates/types", version = "0.1.0", default-features = false }
reallyme-openid4vp-verifier = { path = "../crates/verifier", version = "0.1.0", default-features = false }
reallyme-openid4vp-wallet = { path = "../crates/wallet", version = "0.1.0", default-features = false }
serde_json = "1.0.151"

[[bin]]
name = "dcql_json"
path = "fuzz_targets/dcql_json.rs"
test = false
doc = false
bench = false

