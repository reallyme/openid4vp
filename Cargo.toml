[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "crates/openid4vp",
    "crates/proto",
    "crates/proto-codec",
    "crates/types",
    "crates/dcql",
    "crates/verifier",
    "crates/wallet",
    "crates/dc-api",
    "crates/formats",
    "crates/profiles",
    "crates/runtime",
    "crates/http",
    "conformance",
]

[workspace.package]
edition = "2021"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reallyme/openid4vp"
publish = false

[workspace.dependencies]
idna = "1.1.0"
serde = "1.0.229"
serde_json = "1.0.151"
secrecy = "0.10.3"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.20"
zeroize = "1.9.0"
url = "2.5.8"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
buffa = { version = "0.9.2", features = ["json"] }
reallyme-jose = { version = "=0.4.2", default-features = false }
reallyme-ssi-proto = { version = "=0.3.4", default-features = false }

reallyme-codec = { version = "=0.2.3", default-features = false }
reallyme-cose = { version = "=0.2.5", default-features = false }
reallyme-crypto = { version = "=0.3.9", default-features = false }
reallyme-openid4vc-profiles = { version = "=0.3.4", default-features = false }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
large_include_file = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
