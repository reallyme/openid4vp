name: Protobuf Checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - trunk

permissions:
  contents: read

concurrency:
  group: protobuf-${{ github.ref }}
  cancel-in-progress: true

env:
  BUFFA_VERSION: 0.9.2
  BUF_VERSION: 1.72.0

jobs:
  protobuf:
    name: lint and generated freshness
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.98.1
          components: rustfmt

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: bdedc88f3f25fcc14242730d4dec6ce6a0c75531
          path: .release-readiness
          persist-credentials: false

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-bin: false

      - name: Install buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ github.token }}

      - name: Install pinned Buffa generators
        run: |
          cargo install protoc-gen-buffa --version "$BUFFA_VERSION" --locked
          cargo install protoc-gen-buffa-packaging --version "$BUFFA_VERSION" --locked

      - name: Check canonical protobuf formatting
        run: buf format --diff --exit-code crates/proto/proto

      - name: Check protobuf compatibility
        if: github.event_name == 'pull_request'
        run: buf breaking --against "https://github.com/${GITHUB_REPOSITORY}.git#branch=${{ github.event.repository.default_branch }}"

      - name: Check release readiness generated freshness
        run: node .release-readiness/scripts/run-consumer-check.mjs --generated-freshness
