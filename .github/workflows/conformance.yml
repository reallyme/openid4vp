name: OIDF Protocol Compatibility
run-name: OIDF protocol compatibility @ ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oid4vp-protocol-compatibility:
    name: Pinned OID4VP suite compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: openid4vp
    steps:
      - name: Checkout OpenID4VP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: openid4vp
          persist-credentials: false

      - name: Validate the complete protocol profile inventory
        run: |
          jq -e '
            (.profiles | length) == 6
            and ([.profiles[] | select(.role == "verifier")] | length) == 2
            and ([.profiles[] | select(.role == "wallet")] | length) == 4
            and ([.profiles[].id] | unique | length) == 6
          ' conformance/oidf/profile-matrix.json >/dev/null

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.98.1

      - name: Test repository-owned conformance boundaries
        run: cargo test --locked -p reallyme-openid4vp-conformance --all-features

      - name: Checkout pinned OIDF conformance suite
        run: |
          oidf_suite_commit="$(python3 conformance/scripts/read_oidf_certification_matrix.py \
            commit conformance/oidf/profile-matrix.json)"
          git init target/oidf/conformance-suite
          git -C target/oidf/conformance-suite remote add origin https://gitlab.com/openid/conformance-suite.git
          git -C target/oidf/conformance-suite fetch --depth 1 origin "${oidf_suite_commit}"
          git -C target/oidf/conformance-suite checkout --detach FETCH_HEAD
          test "$(git -C target/oidf/conformance-suite rev-parse HEAD)" = "${oidf_suite_commit}"

      - name: Build pinned OIDF conformance suite
        working-directory: openid4vp/target/oidf/conformance-suite
        run: |
          maven_home="${RUNNER_TEMP}/openid4vp-oidf-maven"
          mkdir -p "${maven_home}/repository"
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/maven-home \
            -e MAVEN_CONFIG=/maven-home \
            -v "${maven_home}:/maven-home" \
            -v "${PWD}:/workspace" \
            -w /workspace \
            maven@sha256:c2a2c58516d160f43b50f12baa427ca86989e0bc942609e04aff61da5d9a7d74 \
            mvn -B -Dmaven.repo.local=/maven-home/repository \
              -Dmaven.test.skip -Dpmd.skip clean package

      - name: Test pinned OID4VP plan implementation
        working-directory: openid4vp/target/oidf/conformance-suite
        run: |
          maven_home="${RUNNER_TEMP}/openid4vp-oidf-maven"
          mkdir -p "${maven_home}/repository"
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/maven-home \
            -e MAVEN_CONFIG=/maven-home \
            -v "${maven_home}:/maven-home" \
            -v "${PWD}:/workspace" \
            -w /workspace \
            maven@sha256:c2a2c58516d160f43b50f12baa427ca86989e0bc942609e04aff61da5d9a7d74 \
            mvn -B -Dmaven.repo.local=/maven-home/repository \
              -Dpmd.skip test \
              -Dtest='VariantCondition_UnitTest,LoadBuiltInDcqlQuery_UnitTest,*VP1Final*'

      - name: Install hash-locked OIDF tooling
        run: |
          runner_venv="${RUNNER_TEMP}/openid4vp-oidf-python"
          python3 -m venv "${runner_venv}"
          "${runner_venv}/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            --only-binary=:all: \
            --require-hashes \
            -r conformance/scripts/oidf-runner-requirements.lock
          echo "${runner_venv}/bin" >> "${GITHUB_PATH}"

      - name: Test conformance control-plane validation
        run: >-
          python3 -m unittest
          conformance/scripts/test_assert_oidf_results.py
          conformance/scripts/test_collect_oidf_verifier_evidence.py
          conformance/scripts/test_drive_oidf_verifier_flow.py
          conformance/scripts/test_drive_oidf_wallet_flow.py
          conformance/scripts/test_oidf_wallet_error_evidence.py
          conformance/scripts/test_prepare_oidf_runtime_config.py
          conformance/scripts/test_read_oidf_certification_matrix.py
          conformance/scripts/test_validate_oidf_runtime_endpoints.py
          conformance/scripts/test_verify_oidf_certification_target.py
          conformance/scripts/test_verify_oidf_wallet_config.py

      - name: Discover and verify the pinned OID4VP target
        run: |
          conformance/scripts/discover_oidf_openid4vp.py \
            target/oidf/conformance-suite \
            target/oidf-protocol-compatibility/discovery
          conformance/scripts/verify_oidf_certification_target.py \
            target/oidf/conformance-suite \
            conformance/oidf/profile-matrix.json
          conformance/scripts/verify_oidf_wallet_config.py \
            target/oidf/conformance-suite \
            conformance/oidf/configs/vp-wallet-test-config-dcql-sdjwt-haip.json \
            --credential-format sd_jwt_vc
          conformance/scripts/verify_oidf_wallet_config.py \
            target/oidf/conformance-suite \
            conformance/oidf/configs/vp-wallet-test-config-dcql-mdoc-haip.json \
            --credential-format iso_mdl

      - name: Record compatibility scope
        run: |
          mkdir -p target/oidf-protocol-compatibility
          jq -n \
            --arg repository_revision "${GITHUB_SHA}" \
            --arg suite_revision "$(git -C target/oidf/conformance-suite rev-parse HEAD)" \
            '{
              schema_version: 1,
              scope: "protocol_compatibility",
              status: "validated",
              repository_revision: $repository_revision,
              suite_revision: $suite_revision,
              profile_inventory_count: 6,
              oidf_plan_execution: false,
              certification_evidence: false
            }' > target/oidf-protocol-compatibility/result.json

      - name: Upload protocol compatibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oidf-protocol-compatibility-${{ github.sha }}
          path: openid4vp/target/oidf-protocol-compatibility
          if-no-files-found: error
          retention-days: 7
