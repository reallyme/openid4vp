name: CI

permissions:
  contents: read

env:
  CARGO_SEMVER_CHECKS_VERSION: 0.50.0

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - trunk

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semver:
    name: Public API semver
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout OpenID4VP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: openid4vp
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # cargo-semver-checks consumes rustdoc JSON, whose schema follows the
      # compiler. Pin both so an upstream release cannot silently change this
      # release gate.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.98.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: openid4vp
          cache-bin: false

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-semver-checks@${{ env.CARGO_SEMVER_CHECKS_VERSION }}

      - name: Check public crate versions against crates.io
        working-directory: openid4vp
        run: node scripts/check-published-semver.mjs

  formal:
    name: Formal protocol models
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Tamarin and Maude binaries
        env:
          TAMARIN_SHA256: 201be06f469e47cff554df6ca93db8366fc2c69d70c61fcbd1370a1074b469c6
          MAUDE_SHA256: 72ed1ca87e3b3d0dfc6ee1436baf154bf04c45ff97d521bec040c5e8dfc8f92c
        run: |
          set -euo pipefail
          formal_tools_dir="${RUNNER_TEMP}/openid4vp-formal-tools"
          mkdir -p "${formal_tools_dir}"
          curl --fail --location --silent --show-error \
            https://github.com/tamarin-prover/tamarin-prover/releases/download/1.12.0/tamarin-prover-1.12.0-linux64-ubuntu.tar.gz \
            --output "${formal_tools_dir}/tamarin.tar.gz"
          echo "${TAMARIN_SHA256}  ${formal_tools_dir}/tamarin.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "${formal_tools_dir}/tamarin.tar.gz" \
            --directory "${formal_tools_dir}"
          curl --fail --location --silent --show-error \
            https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip \
            --output "${formal_tools_dir}/maude.zip"
          echo "${MAUDE_SHA256}  ${formal_tools_dir}/maude.zip" | sha256sum --check --strict
          unzip -q "${formal_tools_dir}/maude.zip" -d "${formal_tools_dir}"
          chmod +x "${formal_tools_dir}/tamarin-prover" "${formal_tools_dir}/maude"
          echo "${formal_tools_dir}" >> "${GITHUB_PATH}"

      - name: Install ripgrep
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: ripgrep@15.2.0

      - name: Prove OpenID4VP composition lemmas
        run: scripts/check-formal-models.sh

  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: openid4vp
    steps:
      - name: Checkout OpenID4VP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: openid4vp
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Install ripgrep
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: ripgrep@15.2.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: openid4vp
          cache-bin: false

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: bdedc88f3f25fcc14242730d4dec6ce6a0c75531
          path: openid4vp/.release-readiness
          persist-credentials: false

      - name: Format
        run: scripts/check-openid4vp-format.sh

      - name: Rust source policy
        run: scripts/check-rust-source-policy.sh

      - name: SSI remote dependency graph
        run: node scripts/check-ssi-remote-resolution.mjs

      - name: SDK facade inventory
        run: node scripts/check-sdk-facade-inventory.mjs

      - name: ZK abstraction boundary
        run: scripts/check-zk-boundary-policy.sh

      - name: Check default native adapter features
        run: |
          cargo check --locked -p reallyme-openid4vp-wallet
          cargo check --locked -p reallyme-openid4vp-verifier
          cargo check --locked -p reallyme-openid4vp-http

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Rust binary packaging policy
        run: scripts/check-rust-packaging.sh

      - name: Proto-first boundary policy
        run: node scripts/check-proto-first-boundaries.mjs

      - name: Release readiness
        run: node .release-readiness/scripts/run-consumer-check.mjs --policy-only

      - name: Rust package inspection
        run: node scripts/publish-crates-in-order.mjs inspect

      - name: Test
        run: cargo test --locked --workspace --all-features

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --locked --workspace --no-deps --all-features

      - name: Test repository policy and release scripts
        run: node --test scripts/*.test.mjs

      - name: Install cargo-deny
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-deny@0.20.2

      - name: Install cargo-audit
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-audit@0.22.2

      - name: Cargo deny
        run: |
          cargo deny --locked check
          cargo deny --locked --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml check

      - name: Audit every committed lockfile
        run: scripts/audit_committed_lockfiles.sh

  public-msrv:
    name: Public crates MSRV 1.96
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: openid4vp
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
    steps:
      - name: Checkout OpenID4VP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: openid4vp
          persist-credentials: false

      - name: Install Rust MSRV toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.96.0

      - name: Cache public-crate MSRV build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: openid4vp
          key: public-msrv-1.96
          cache-bin: false

      - name: Check the exact crates.io publish set at MSRV
        run: |
          set -euo pipefail
          rustc --version | grep -F 'rustc 1.96.0 '
          cargo check --locked --all-features \
            -p reallyme-openid4vp-proto \
            -p reallyme-openid4vp-dcql \
            -p reallyme-openid4vp-types \
            -p reallyme-openid4vp-dc-api \
            -p reallyme-openid4vp-formats \
            -p reallyme-openid4vp-wallet

  wasm-composition:
    name: Identity Wasm composition inputs
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: openid4vp
    steps:
      - name: Checkout OpenID4VP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: openid4vp
          persist-credentials: false

      - name: Install Rust toolchain and Wasm target
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown

      - name: Cache composed-Wasm inputs
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: openid4vp
          key: wasm32-unknown-unknown
          cache-bin: false

      - name: Check Identity's composed-Wasm input crates
        run: >-
          cargo check --locked --target wasm32-unknown-unknown
          --no-default-features --features wasm
          -p reallyme-openid4vp-types
          -p reallyme-openid4vp-dc-api
          -p reallyme-openid4vp-formats
          -p reallyme-openid4vp-verifier
          -p reallyme-openid4vp-wallet
          -p reallyme-openid4vp-proto-codec
          -p reallyme-openid4vp-runtime
          -p reallyme-openid4vp

      - name: Check the Wasm facade with JOSE enabled
        run: >-
          cargo check --locked --target wasm32-unknown-unknown
          --no-default-features --features wasm,jose
          -p reallyme-openid4vp

  mobile-composition:
    name: Mobile native composition (${{ matrix.target }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-ios
          - aarch64-linux-android
    defaults:
      run:
        working-directory: openid4vp
    steps:
      - name: Checkout OpenID4VP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: openid4vp
          persist-credentials: false

      - name: Install Rust toolchain and mobile target
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Check native facade for the mobile target
        run: >-
          cargo check --locked --target ${{ matrix.target }}
          --no-default-features --features native
          -p reallyme-openid4vp
