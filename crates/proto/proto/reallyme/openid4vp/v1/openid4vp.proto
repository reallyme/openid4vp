// DcApiRequestKind is the OpenID4VP Digital Credentials API protocol kind.
enum DcApiRequestKind {
  DC_API_REQUEST_KIND_UNSPECIFIED = 0;
  DC_API_REQUEST_KIND_UNSIGNED = 1;
  DC_API_REQUEST_KIND_SIGNED = 2;
  DC_API_REQUEST_KIND_MULTISIGNED = 3;
}

// PresentationValue is one presentation value inside a DCQL-keyed vp_token entry.
message PresentationValue {
  oneof kind {
    // Compact string presentation, such as SD-JWT VC.
    string compact = 1;
    // JSON-native presentation encoded as canonical UTF-8 JSON bytes. The
    // proto codec enforces a 2 MiB limit, 64-level nesting, and unique keys.
    bytes json = 2;
    // ReallyMe ZK presentation envelope.
    ZkPresentation zk = 3;
  }
}

// DerivedClaimStatement is one non-PII statement proven by a ZK presentation.
message DerivedClaimStatement {
  string statement_id = 1;
  string statement = 2;
}

// ZkPresentationBinding carries the session hashes that an external proof
// verifier must authenticate against the active OpenID4VP request.
message ZkPresentationBinding {
  bytes nonce_hash = 1;
  bytes audience_hash = 2;
  optional bytes transaction_data_hash = 3;
}

// ZkPresentationProofSuite identifies every approved proof-system option that
// affects verification. Unrecognized suites fail closed at the codec boundary.
enum ZkPresentationProofSuite {
  ZK_PRESENTATION_PROOF_SUITE_UNSPECIFIED = 0;
  ZK_PRESENTATION_PROOF_SUITE_BARRETENBERG_ULTRA_HONK_KECCAK_ZK_NO_IPA = 1;
}

// ZkPresentationProfile identifies the complete credential-proof profile.
enum ZkPresentationProfile {
  ZK_PRESENTATION_PROFILE_UNSPECIFIED = 0;
  ZK_PRESENTATION_PROFILE_PRIVATE_CLAIM_V1 = 1;
  ZK_PRESENTATION_PROFILE_PRIVATE_PERSONA_CLAIM_V1 = 2;
  ZK_PRESENTATION_PROFILE_PUBLIC_PERSONA_CLAIM_V1 = 3;
}

// ZkPresentationStageKind identifies one required production proof stage.
enum ZkPresentationStageKind {
  ZK_PRESENTATION_STAGE_KIND_UNSPECIFIED = 0;
  ZK_PRESENTATION_STAGE_KIND_SESSION = 1;
  ZK_PRESENTATION_STAGE_KIND_CREDENTIAL_ENVELOPE = 2;
  ZK_PRESENTATION_STAGE_KIND_CREDENTIAL_ROOT = 3;
  ZK_PRESENTATION_STAGE_KIND_CLAIM = 4;
}

// ZkPresentation is the OpenID4VP vp_token envelope for a ReallyMe ZK proof.
message ZkPresentation {
  reserved 2, 3, 4, 7, 9;
  reserved "circuit_id", "proof", "public_inputs", "circuit_ref", "artifact_manifest_sha256";

  string type = 1;
  repeated DerivedClaimStatement derived_claims = 5;
  ZkPresentationBinding binding = 6;
  ZkPresentationProofSuite proof_suite = 8;
  ZkPresentationProfile profile = 10;
  repeated ZkPresentationStage stages = 11;
}

// ZkPresentationStage carries one exact circuit proof in the production bundle.
message ZkPresentationStage {
  ZkPresentationStageKind stage = 1;
  ZkPresentationCircuitRef circuit_ref = 2;
  bytes artifact_manifest_sha256 = 3;
  bytes proof = 4;
  bytes public_inputs = 5;
}

// ZkPresentationCircuitRef names the exact imported circuit source used by
// an artifact-backed proof. The presentation profile remains the policy-level
// stable identifier; this ref binds verifier backends to concrete artifacts.
message ZkPresentationCircuitRef {
  string hash_strategy = 1;
  string family = 2;
  string stage = 3;
  uint32 version = 4;
}

// ClientIdentifier carries the parsed final-spec client_id.
message ClientIdentifier {
  ClientIdentifierPrefix prefix = 1;
  string identifier = 2;
  string wire_value = 3;
}

// ClientMetadata carries verifier metadata as canonical UTF-8 JSON bytes. The
// proto codec enforces a 256 KiB limit, 64-level nesting, and unique keys.
message ClientMetadata {
  bytes json = 1;
}

// TransactionData is the OpenID4VP final transaction_data object.
message TransactionData {
  string type = 1;
  repeated string credential_ids = 2;
  // Profile payload encoded as canonical UTF-8 JSON bytes. The proto codec
  // enforces a 256 KiB limit, 64-level nesting, and unique keys.
  bytes payload_json = 3;
  // Exact final-spec base64url string received on the wire. Hashing this
  // retained value avoids silently changing a valid non-canonical JSON input.
  optional string encoded_value = 4;
}

// AuthorizationRequest is the final OpenID4VP request object projection.
message AuthorizationRequest {
  optional ClientIdentifier client_id = 1;
  ResponseType response_type = 2;
  optional ResponseMode response_mode = 3;
  optional string response_uri = 4;
  optional string redirect_uri = 5;
  string nonce = 6;
  optional string wallet_nonce = 7;
  optional string state = 8;
  // DCQL remains a JSON-defined query language; this field carries canonical
  // UTF-8 JSON bytes for the dcql_query object. The proto codec enforces a
  // 256 KiB limit, 64-level nesting, unique keys, and DCQL validation.
  bytes dcql_query_json = 9;
  repeated TransactionData transaction_data = 10;
  optional ClientMetadata client_metadata = 11;
  repeated string expected_origins = 12;
  optional string iss = 13;
  repeated string aud = 14;
  optional uint64 iat = 15;
  optional uint64 exp = 16;
  // Non-standard metadata-by-reference extension. Wallet validation rejects
  // this unless the host injects fresh trusted metadata evidence.
  optional string client_metadata_uri = 17;
}

// VpTokenEntry is one final-spec vp_token object member keyed by DCQL query id.
message VpTokenEntry {
  string query_id = 1;
  repeated PresentationValue presentations = 2;
}

// AuthorizationResponse is the final OpenID4VP response object projection.
message AuthorizationResponse {
  repeated VpTokenEntry vp_token = 1;
  optional string state = 2;
  // Transaction-data bindings belong inside each format-specific holder proof,
  // not in the OpenID4VP Authorization Response object.
  reserved 3, 4;
}

// RequestBinding is verifier session binding material.
message TransactionDataBinding {
  // DCQL credential-query identifier whose holder proof carries the digest.
  string query_id = 1;
  // Registered digest algorithm name. OpenID4VP currently defines sha-256.
  string algorithm = 2;
  // Digest over the exact encoded transaction_data string.
  bytes digest = 3;
}

message RequestBinding {
  ClientIdentifier client_id = 1;
  string nonce = 2;
  optional string response_uri = 3;
  optional string redirect_uri = 4;
  uint64 expiry_unix = 5;
  // Field 6 held one lossy digest before ordered, query-scoped bindings were
  // implemented. It must never be reused because persisted sessions can outlive
  // a binary rollout.
  reserved 6;
  // Browser origin used instead of an HTTP response endpoint for DC API modes.
  optional string dc_api_origin = 7;
  // Ordered bindings. Duplicate transaction_data entries are significant and
  // therefore intentionally preserved.
  repeated TransactionDataBinding transaction_data_bindings = 8;
}

// HolderBindingClaims is the decoded holder proof subset checked by OpenID4VP.
message HolderBindingClaims {
  repeated string audience = 1;
  string nonce = 2;
  uint64 expiration_unix = 3;
  uint64 issued_at_unix = 4;
  optional string sd_hash = 5;
  // Digests extracted only after the format-specific holder proof verifies.
  repeated bytes transaction_data_hashes = 6;
  optional string transaction_data_hashes_alg = 7;
}

// SessionRecord is verifier session state retained between request and response.
message SessionRecord {
  RequestBinding binding = 1;
  optional string state = 2;
  // DCQL query used to create the request; retained for response validation.
  // The same 256 KiB, 64-level, unique-key policy applies here.
  bytes dcql_query_json = 3;
  // Exact canonical ISO SessionTranscript CBOR retained at request launch.
  // Absent for sessions that cannot select mdoc; otherwise limited to 256 bytes.
  optional bytes mdoc_session_transcript_cbor = 4;
  // HTTPS destination returned after a successful direct-post response.
  // This is distinct from the Authorization Request redirect_uri and is
  // required by HAIP 1.0 while remaining optional in base OpenID4VP.
  optional string post_response_redirect_uri = 5;
  // Exact response mode negotiated for this one-time session. Runtime
  // endpoints reject a plaintext/encrypted route mismatch before validation.
  ResponseMode response_mode = 6;
  // SHA-256 JWK thumbprint used when the retained mdoc SessionTranscript was
  // built. Absent only when the selected handover profile has no response key.
  // Decoders require exactly 32 bytes when this field is present.
  optional bytes mdoc_response_key_thumbprint_sha256 = 7;
  // Opaque initiating browser-session receipt plus the absolute deadline for
  // the one-time HAIP same-device follow-back. The binding is exactly 32 bytes.
  optional FollowBackRequirement follow_back_requirement = 8;
}

message FollowBackRequirement {
  bytes browser_session_binding = 1;
  uint64 expires_unix = 2;
}

// HostedRequestObject is verifier request_uri state retained between launch
// and wallet retrieval. Deferred POST material is encoded as the canonical
// AuthorizationRequest rather than a second JSON model.
message HostedRequestObject {
  oneof material {
    string signed_request_object_jwt = 1;
    AuthorizationRequest deferred_post_authorization_request = 2;
  }
}

// ProblemDetails is the RFC 9457 problem details projection.
message ProblemDetails {
  string type = 1;
  string title = 2;
  uint32 status = 3;
  optional string instance = 4;
  ProblemKind kind = 5;
}

// DirectPostSuccessResponse is the JSON body returned after the verifier
// accepts an Authorization Response at its response_uri.
message DirectPostSuccessResponse {
  // HAIP 1.0 requires this destination; base OpenID4VP permits omission.
  optional string redirect_uri = 1 [json_name = "redirect_uri"];
  // Opaque, single-use code redeemable for the durably stored verified result.
  optional string response_code = 2 [json_name = "response_code"];
}

// RequestJwt transport carries a by-value Request Object JWT.
message RequestJwtTransport {
  string jwt = 1;
  optional string expected_client_id = 2;
  optional string expected_wallet_nonce = 3;
}

// RequestUri transport carries a by-reference Request Object.
message RequestUriTransport {
  string uri = 1;
  RequestUriMethod method = 2;
  optional string wallet_nonce = 3;
  optional string expected_client_id = 4;
}

// InlineParam is one explicitly named development/interop parameter. A
// repeated message is used instead of a protobuf map so duplicate names remain
// observable and can be rejected by the strict codec boundary.
message InlineParam {
  string name = 1;
  string value = 2;
}

// InlineParams transport is only for explicit development or interop lab policy.
message InlineParamsTransport {
  repeated InlineParam params = 1;
}

// AuthorizationRequestTransport classifies the inbound authorization request.
message AuthorizationRequestTransport {
  oneof transport {
    RequestJwtTransport request_jwt = 1;
    RequestUriTransport request_uri = 2;
    InlineParamsTransport inline_params = 3;
  }
}

// DcApiProtocol identifies the W3C Digital Credentials API OpenID4VP protocol.
message DcApiProtocol {
  uint32 version = 1;
  DcApiRequestKind kind = 2;
}

// JwsJsonSignature is one protected signature over a JWS JSON shared payload.
message JwsJsonSignature {
  string protected = 1;
  string signature = 2;
}

// JwsJsonGeneral is RFC 7515 JWS JSON General Serialization.
message JwsJsonGeneral {
  string payload = 1;
  repeated JwsJsonSignature signatures = 2;
}

// DigitalCredentialGetRequest is one navigator.credentials.get request entry.
message DigitalCredentialGetRequest {
  string protocol = 1;
  oneof data {
    AuthorizationRequest unsigned_request = 2;
    string signed_request = 3;
    JwsJsonGeneral multisigned_request = 4;
  }
}

// DigitalCredentialRequestOptions is CredentialRequestOptions.digital.
message DigitalCredentialRequestOptions {
  repeated DigitalCredentialGetRequest requests = 1;
}

// DcApiAuthorizationResponse is the response for response_mode=dc_api.
message DcApiAuthorizationResponse {
  AuthorizationResponse data = 1;
}

// EncryptedDcApiAuthorizationResponse is the response for response_mode=dc_api.jwt.
message EncryptedDcApiAuthorizationResponse {
  string response = 1;
}

// OpenId4VpOperationContractVersion versions the composed SDK boundary
// independently from individual OpenID4VP message evolution.
enum OpenId4VpOperationContractVersion {
  OPEN_ID4_VP_OPERATION_CONTRACT_VERSION_UNSPECIFIED = 0;
  OPEN_ID4_VP_OPERATION_CONTRACT_VERSION_V1 = 1;
}

// OpenId4VpOperationError is a deterministic platform-boundary failure. It
// never carries backend text, presentation material, or caller input.
message OpenId4VpOperationError {
  OpenId4VpErrorReason reason = 1;
}

// OpenId4VpOperationRequest structurally decodes and normalizes one generated
// OpenID4VP document. AuthorizationResponse is retained for wire compatibility
// but returns RUNTIME_UNSUPPORTED_FEATURE: authorization requires server-owned
// state, trust, clock, and atomic commit dependencies absent from this codec.
message OpenId4VpOperationRequest {
  OpenId4VpOperationContractVersion contract_version = 1;
  oneof operation {
    AuthorizationRequest authorization_request = 10;
    AuthorizationResponse authorization_response = 11;
    AuthorizationRequestTransport authorization_request_transport = 12;
    // Removed pre-0.1 DTOs used incorrect final-spec metadata shapes.
    // Metadata remains available through the exact ClientMetadata JSON object.
    // These field numbers must never be reused.
    DigitalCredentialRequestOptions digital_credential_request_options = 15;
    ProblemDetails problem_details = 16;
  }
  reserved 13, 14;
}

// OpenId4VpOperationResult contains the validated canonical message matching
// the request operation. The nested result keeps success/error framing stable
// as new operation kinds are introduced.
message OpenId4VpOperationResult {
  oneof result {
    AuthorizationRequest authorization_request = 10;
    AuthorizationResponse authorization_response = 11;
    AuthorizationRequestTransport authorization_request_transport = 12;
    DigitalCredentialRequestOptions digital_credential_request_options = 15;
    ProblemDetails problem_details = 16;
  }
  reserved 13, 14;
}

// OpenId4VpOperationResponse returns one generated result or one typed error.
// Consumers must verify both the contract version and matching result oneof.
message OpenId4VpOperationResponse {
  oneof outcome {
    OpenId4VpOperationResult result = 1;
    OpenId4VpOperationError error = 2;
  }
  OpenId4VpOperationContractVersion contract_version = 3;
}

// BuildAuthorizationRequestRequest asks a verifier adapter to construct a
// request object projection. Signing policy and key selection are deliberately
// adapter-owned so private key material never crosses this API boundary.
message BuildAuthorizationRequestRequest {
  AuthorizationRequest request = 1;
  bool sign_request_object = 2;
  // Trusted verifier clock used to enforce iat/exp before signing.
  uint64 now_unix = 3;
}

// BuildAuthorizationRequestResponse returns either an unsigned request object
// or a compact signed Request Object JWT, plus verifier session binding.
message BuildAuthorizationRequestResponse {
  optional AuthorizationRequest request = 1;
  optional string request_jwt = 2;
  optional RequestBinding binding = 3;
  optional ProblemDetails problem = 4;
}

// ValidateAuthorizationResponseRequest is retained for wire compatibility.
// Runtime implementations reject this caller-owned session/clock operation;
// authorization requires the server-owned HTTP runtime lifecycle.
message ValidateAuthorizationResponseRequest {
  SessionRecord session = 1;
  AuthorizationResponse response = 2;
  uint64 now_unix = 3;
}

// ValidateAuthorizationResponseResponse carries validation outcome without
// exposing raw request or credential material in error strings.
message ValidateAuthorizationResponseResponse {
  bool valid = 1;
  optional ProblemDetails problem = 2;
}

// ParseAuthorizationRequestTransportRequest classifies a wallet inbound
// authorization request before network-bound request_uri resolution.
message ParseAuthorizationRequestTransportRequest {
  string input = 1;
  uint64 max_request_jwt_bytes = 2;
  bool require_signed_request_object = 3;
}

// ParseAuthorizationRequestTransportResponse returns the pure transport parse
// result or a typed RFC 9457 problem.
message ParseAuthorizationRequestTransportResponse {
  optional AuthorizationRequestTransport transport = 1;
  optional ProblemDetails problem = 2;
}

// VerifyAuthorizationRequestRequest verifies request-object signature,
// client_id prefix binding, origin binding, and expiry after adapters resolve
// any request_uri content.
message VerifyAuthorizationRequestRequest {
  AuthorizationRequestTransport transport = 1;
  optional string origin = 2;
  uint64 now_unix = 3;
}

// VerifyAuthorizationRequestResponse returns the verified final-spec request
// projection or a typed RFC 9457 problem.
message VerifyAuthorizationRequestResponse {
  optional AuthorizationRequest request = 1;
  optional ProblemDetails problem = 2;
}

// BuildDigitalCredentialRequestOptionsRequest builds browser
// CredentialRequestOptions.digital from typed OpenID4VP request entries.
message BuildDigitalCredentialRequestOptionsRequest {
  repeated DigitalCredentialGetRequest requests = 1;
}

// BuildDigitalCredentialRequestOptionsResponse returns Digital Credentials API
// request options or a typed RFC 9457 problem.
message BuildDigitalCredentialRequestOptionsResponse {
  optional DigitalCredentialRequestOptions options = 1;
  optional ProblemDetails problem = 2;
}

// DecodeDcApiAuthorizationResponseRequest normalizes plaintext or encrypted
// DC API responses after browser delivery.
message DecodeDcApiAuthorizationResponseRequest {
  oneof response {
    DcApiAuthorizationResponse plaintext = 1;
    EncryptedDcApiAuthorizationResponse encrypted = 2;
  }
}

// DecodeDcApiAuthorizationResponseResponse is retained for wire compatibility.
// Runtime implementations fail closed until a server-owned session and
// authenticated browser-origin context are supplied by a replacement endpoint.
message DecodeDcApiAuthorizationResponseResponse {
  optional AuthorizationResponse response = 1;
  optional ProblemDetails problem = 2;
}
