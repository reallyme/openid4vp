[package]
name = "reallyme-openid4vp-proto"
version = "0.1.1"
description = "ReallyMe OpenID4VP protobuf bindings generated with Buffa."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/reallyme-openid4vp-proto"
keywords = ["openid4vp", "protobuf", "identity", "credentials"]
categories = ["authentication", "encoding"]
publish = true
include = [
    "/src/**/*.rs",
    "/proto/**/*.proto",
    "/tests/**/*",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]

[features]
default = ["generated"]
generated = [
    "dep:buffa",
    "dep:serde",
    "dep:zeroize",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
buffa = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
