[package]
name = "reallyme-openid4vp-verifier"
version = "0.1.1"
description = "OpenID4VP verifier request and response validation boundary."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md"]

[features]
default = ["native"]
native = [
    "reallyme-openid4vp-dc-api/native",
    "reallyme-openid4vp-formats/native",
]
wasm = [
    "reallyme-openid4vp-dc-api/wasm",
    "reallyme-openid4vp-formats/wasm",
]

[dependencies]
reallyme-codec = { workspace = true, features = ["base64url"] }
reallyme-openid4vp-dc-api = { path = "../dc-api", version = "0.1.1", default-features = false }
reallyme-openid4vp-dcql = { path = "../dcql", version = "0.1.1" }
reallyme-openid4vp-formats = { path = "../formats", version = "0.1.1", default-features = false }
reallyme-openid4vp-types = { path = "../types", version = "0.1.1", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }

[lints]
workspace = true
