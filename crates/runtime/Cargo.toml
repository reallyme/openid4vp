[package]
name = "reallyme-openid4vp-runtime"
version = "0.1.1"
description = "Runtime protobuf operations and HTTP adapters for ReallyMe OpenID4VP."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md"]

[features]
default = ["native", "jose"]
native = [
    "reallyme-crypto/native",
    "reallyme-jose?/native",
    "reallyme-openid4vp-dc-api/native",
    "reallyme-openid4vp-proto-codec/native",
    "reallyme-openid4vp-verifier/native",
]
wasm = [
    "reallyme-crypto/wasm",
    "reallyme-jose?/wasm",
    "reallyme-openid4vp-dc-api/wasm",
    "reallyme-openid4vp-proto-codec/wasm",
    "reallyme-openid4vp-verifier/wasm",
]
jose = ["dep:reallyme-jose", "reallyme-jose/jose-crypto"]

[dependencies]
buffa = { workspace = true }
reallyme-openid4vp-dc-api = { path = "../dc-api", version = "0.1.1", default-features = false }
reallyme-openid4vp-proto = { path = "../proto", version = "0.1.1", default-features = false, features = ["generated"] }
reallyme-openid4vp-proto-codec = { path = "../proto-codec", version = "0.1.1", default-features = false }
reallyme-ssi-proto = { workspace = true, features = ["generated"] }
reallyme-openid4vp-types = { path = "../types", version = "0.1.1", default-features = false }
reallyme-openid4vp-verifier = { path = "../verifier", version = "0.1.1", default-features = false }
reallyme-codec = { workspace = true, features = ["base64url"] }
reallyme-crypto = { workspace = true, features = ["csprng"] }
reallyme-jose = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
reallyme-crypto = { workspace = true, features = ["aes", "p256"] }
reallyme-openid4vp-dcql = { path = "../dcql", version = "0.1.1", default-features = false }

[lints]
workspace = true
