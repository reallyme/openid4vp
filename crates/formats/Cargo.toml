[package]
name = "reallyme-openid4vp-formats"
version = "0.1.1"
description = "Format-specific OpenID4VP presentation glue."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/reallyme-openid4vp-formats"
publish = true
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md"]

[features]
default = ["native"]
native = ["reallyme-mdoc/native", "reallyme-sd-jwt/native", "reallyme-crypto/native", "reallyme-jose/native"]
wasm = ["reallyme-mdoc/wasm", "reallyme-sd-jwt/wasm", "reallyme-crypto/wasm", "reallyme-jose/wasm"]

[dependencies]
reallyme-mdoc = { version = "=0.3.4", default-features = false }
reallyme-sd-jwt = { version = "=0.3.4", default-features = false }
reallyme-crypto = { workspace = true }
reallyme-codec = { workspace = true, features = ["base64url"] }
reallyme-jose = { workspace = true }
reallyme-openid4vp-dcql = { path = "../dcql", version = "0.1.1" }
reallyme-openid4vp-types = { path = "../types", version = "0.1.1", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
reallyme-cose = { workspace = true }
reallyme-crypto = { workspace = true, features = ["dispatch", "p256"] }

[lints]
workspace = true
