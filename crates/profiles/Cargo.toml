[package]
name = "reallyme-openid4vp-profiles"
version = "0.3.1"
description = "OpenID4VP presentation profiles."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md"]

[dependencies]
reallyme-openid4vp-dcql = { path = "../dcql", version = "0.3.1" }
reallyme-openid4vp-types = { path = "../types", version = "0.3.1", default-features = false }
reallyme-openid4vc-profiles = { workspace = true }
reallyme-codec = { workspace = true, features = ["base64url"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }

[lints]
workspace = true
